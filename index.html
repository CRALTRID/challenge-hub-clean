<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>共享挑战日历</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.06);
      --shadow-strong: 0 14px 36px rgba(15, 23, 42, 0.1);
      --accent: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .title h1 {
      margin: 0 0 6px;
      font-size: 30px;
      line-height: 1.2;
    }

    .title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar,
    .sub-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
    }

    button,
    select,
    input {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    button:hover,
    select:hover {
      opacity: 0.96;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(235px, 0.62fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .calendar-panel {
      padding: 18px;
      box-shadow: var(--shadow-strong);
    }

    .side-panel {
      padding: 14px;
      position: sticky;
      top: 16px;
      align-self: start;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .panel-title h2,
    .panel-title h3 {
      margin: 0;
      font-size: 20px;
    }

    .small {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .month-title {
      font-size: 24px;
      font-weight: 700;
    }

    .month-heading {
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .month-average-summary {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
    }

    .weekday-row,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }

    .weekday {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 7px 0;
    }

    .day {
      min-height: 108px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #fff;
      padding: 10px;
      position: relative;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      overflow: hidden;
    }

    .day:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
    }

    .day.other-month {
      opacity: 0.35;
      background: #f9fafb;
    }

    .day.filtered-out,
    .mini-day.filtered-out {
      opacity: 0.18;
      filter: grayscale(0.7);
    }

    .day.today {
      outline: 2px solid #111827;
      outline-offset: -2px;
    }

    .date-number {
      font-size: 15px;
      font-weight: 700;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 7px;
    }

    .entry-label {
      font-size: 11px;
      font-weight: 700;
      border-radius: 7px;
      padding: 4px 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111827;
    }

    .entry-more {
      color: var(--muted);
      font-size: 10px;
      padding-left: 4px;
    }

    .entry-note {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      font-size: 10px;
      color: #374151;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 8px;
      padding: 3px 6px;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mini-month {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px;
      background: #fff;
      cursor: pointer;
    }

    .mini-month:hover {
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.05);
    }

    .mini-month-title {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .mini-weekdays,
    .mini-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .mini-weekdays div {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
    }

    .mini-day {
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      border: 1px solid #f1f5f9;
      background: #fff;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #334155;
      user-select: none;
    }

    .mini-day.empty {
      visibility: hidden;
    }

    .mini-day-number {
      position: relative;
      z-index: 1;
      font-weight: 600;
    }

    .mini-day.has-entry::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 6px;
      padding: 2px;
      background: var(--event-border);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .mini-dots {
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 2px;
      display: flex;
      justify-content: center;
      gap: 1px;
      z-index: 2;
    }

    .mini-dot {
      width: 6px;
      height: 6px;
      min-width: 3px;
      flex: 0 1 6px;
      border-radius: 999px;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.9);
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .legend-item {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      background: #fafafa;
    }

    .legend-color {
      width: 28px;
      height: 28px;
      border: none;
      padding: 0;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
    }

    .legend-color::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .legend-color::-webkit-color-swatch {
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 8px;
    }

    .legend-color::-moz-color-swatch {
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 8px;
    }

    .legend-main {
      min-width: 0;
    }

    .legend-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 8px;
      font-size: 12px;
      background: #fff;
      margin-bottom: 4px;
    }

    .legend-count {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.3;
    }

    .icon-btn {
      padding: 8px 10px;
      min-width: 40px;
    }

    .legend-actions {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 54px;
    }

    .link-btn {
      padding: 8px 10px;
      font-size: 12px;
    }

    .legend-actions button {
      width: 100%;
      min-width: 0;
      padding: 8px 6px;
      font-size: 12px;
    }

    .legend-tools {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fafafa;
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      margin-bottom: 2px;
    }

    .average-panel {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .average-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .average-header strong { font-size: 14px; }

    .average-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .average-item {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 9px;
      background: #fafafa;
    }

    .average-color {
      width: 10px;
      height: 28px;
      border-radius: 999px;
    }

    .average-value {
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .save-status {
      margin-top: 12px;
      min-height: 18px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.18);
    }

    .selected-date {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 14px 0;
    }

    .option {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 11px;
      cursor: pointer;
      display: flex;
      gap: 10px;
      align-items: center;
      background: white;
    }

    .option:hover {
      background: #f9fafb;
    }

    .option.selected {
      border-color: #111827;
      box-shadow: 0 0 0 2px rgba(17, 24, 39, 0.08);
      background: #f8fafc;
    }

    .option-text {
      min-width: 0;
      flex: 1;
    }

    .option-check {
      font-size: 12px;
      font-weight: 700;
      color: #111827;
      white-space: nowrap;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      flex: 0 0 26px;
    }

    .note-box {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      min-height: 92px;
      padding: 10px 12px;
      font-size: 14px;
      resize: vertical;
      font-family: inherit;
      margin-top: 8px;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .hidden {
      display: none !important;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(150px, 220px) auto;
      gap: 8px;
      margin-bottom: 14px;
    }

    .actions-menu > summary,
    .filter-menu > summary {
      display: none;
    }

    .actions-menu > .sub-toolbar {
      display: flex;
    }

    .filter-menu > .filter-bar {
      display: grid;
    }

    .filter-menu { flex-basis: 100%; }

    .filter-bar input,
    .filter-bar select {
      width: 100%;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 52vh;
      overflow: auto;
      margin-top: 14px;
    }

    .history-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fafafa;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side-panel {
        position: static;
      }

      .year-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 760px) {
      .wrap {
        padding: 8px;
      }

      .topbar { display: block; margin-bottom: 8px; }

      .title p { display: none; }

      .toolbar {
        gap: 6px;
        flex-wrap: nowrap;
        overflow-x: auto;
        padding-bottom: 3px;
        scrollbar-width: none;
      }

      .toolbar::-webkit-scrollbar { display: none; }

      .toolbar > * { flex: 0 0 auto; }

      .toolbar button,
      .toolbar select { padding: 8px 9px; }

      .calendar-panel { padding: 9px; border-radius: 14px; }

      .panel-title { margin-bottom: 7px; }

      .calendar-panel > .panel-title {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .calendar-panel > .panel-title > .month-heading { grid-column: 1 / -1; }

      .month-average-summary { font-size: 10px; }

      .weekday-row,
      .calendar-grid { gap: 3px; }

      .title h1 {
        font-size: 20px;
        margin-bottom: 8px;
      }

      .month-title {
        font-size: 20px;
      }

      .day {
        min-height: 74px;
        padding: 6px;
        border-radius: 10px;
      }

      .date-number { font-size: 13px; }

      .entry-list { margin-top: 4px; gap: 2px; }

      .entry-label { font-size: 9px; padding: 3px 5px; }

      .entry-note {
        font-size: 9px;
      }

      .option-grid {
        grid-template-columns: 1fr;
      }

      .year-grid {
        grid-template-columns: 1fr;
      }

      .modal {
        align-items: end;
        padding: 0;
      }

      .modal-card {
        max-width: none;
        max-height: 90vh;
        overflow-y: auto;
        border-radius: 18px 18px 0 0;
        padding: 18px 18px 24px;
      }

      .modal-actions {
        position: sticky;
        bottom: -24px;
        background: #fff;
        padding: 12px 0 6px;
      }

      .filter-bar {
        grid-template-columns: 1fr 1fr;
        margin: 8px 0 10px;
      }

      .filter-bar input { grid-column: 1 / -1; }

      .actions-menu,
      .filter-menu { width: auto; min-width: 0; }

      .actions-menu[open],
      .filter-menu[open] { grid-column: 1 / -1; }

      .actions-menu > summary,
      .filter-menu > summary {
        display: block;
        list-style: none;
        cursor: pointer;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 9px;
        padding: 7px 10px;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }

      .actions-menu > summary::-webkit-details-marker,
      .filter-menu > summary::-webkit-details-marker { display: none; }

      .actions-menu:not([open]) > .sub-toolbar,
      .filter-menu:not([open]) > .filter-bar { display: none; }

      .actions-menu[open] > .sub-toolbar {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        margin-top: 8px;
      }

      .actions-menu[open] > .sub-toolbar button { width: 100%; }

      .filter-menu { margin-bottom: 4px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="title">
        <h1>共享挑战日历</h1>
      </div>

      <div class="toolbar">
        <button id="monthViewBtn" class="primary">月视图</button>
        <button id="yearViewBtn">年视图</button>
        <button id="prevBtn">上一个</button>
        <button id="todayBtn">今天</button>
        <button id="thisYearBtn">今年</button>
        <button id="nextBtn">下一个</button>
        <select id="yearSelect"></select>
        <select id="monthSelect"></select>
      </div>
    </div>

    <div class="layout">
      <div class="panel calendar-panel">
        <div class="panel-title">
          <div class="month-heading">
            <div class="month-title" id="mainTitle"></div>
            <div class="month-average-summary" id="monthAverageSummary"></div>
          </div>
          <details class="actions-menu" open>
            <summary>数据工具</summary>
            <div class="sub-toolbar">
              <button id="undoBtn">撤销修改</button>
              <button id="historyBtn">修改记录</button>
              <button id="importJsonBtn">导入备份</button>
              <button id="exportJsonBtn">导出 JSON</button>
              <button id="exportCsvBtn">导出 CSV</button>
              <input id="importJsonInput" class="hidden" type="file" accept="application/json,.json" />
            </div>
          </details>
          <details class="filter-menu" open>
            <summary>搜索与筛选</summary>
            <div class="filter-bar">
              <input id="searchInput" type="search" placeholder="搜索任务名称或备注…" />
              <select id="filterLegendSelect"><option value="">全部任务</option></select>
              <button id="clearFilterBtn">清除筛选</button>
            </div>
          </details>
        </div>

        <div id="monthView">
          <div class="weekday-row">
            <div class="weekday">日</div>
            <div class="weekday">一</div>
            <div class="weekday">二</div>
            <div class="weekday">三</div>
            <div class="weekday">四</div>
            <div class="weekday">五</div>
            <div class="weekday">六</div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div id="yearView" style="display:none;">
          <div class="year-grid" id="yearGrid"></div>
        </div>
      </div>

      <div class="panel side-panel">
        <div class="panel-title">
          <h2>记录类型</h2>
        </div>

        <div class="small">任何打开这个链接的人都可以直接查看和编辑。你可以新增、删除、修改颜色和名称。</div>

        <div class="legend-list" id="legendList"></div>

        <div class="legend-tools">
          <button id="addLegendBtn" class="primary">新增类型</button>
        </div>

        <div class="stats">
          <div class="stat">
            <strong id="rangeCount">0</strong>
            <span class="small" id="rangeLabel">当前范围已记录</span>
          </div>
          <div class="stat">
            <strong id="totalCount">0</strong>
            <span class="small" id="totalLabel">总记录天数</span>
          </div>
        </div>

        <div class="average-panel">
          <div class="average-header">
            <strong id="frequencyPanelTitle">月度完成频率</strong>
            <button id="chooseAverageTasksBtn" class="link-btn">选择任务</button>
          </div>
          <div class="small" id="averageRangeText"></div>
          <div class="average-list" id="averageList"></div>
        </div>

        <div class="save-status" id="saveStatus">数据已同步</div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="selected-date" id="selectedDateText"></div>
      <div class="small">可同时选择多个挑战类型，再输入当天备注。</div>

      <div class="option-grid" id="optionGrid"></div>

      <div class="small" style="margin-top:4px;">备注</div>
      <textarea id="noteInput" class="note-box" placeholder="写一点备注，例如：今天完成得不错 / 只做了一半 / 和朋友一起完成"></textarea>

      <div class="small" id="lastUpdatedText" style="margin-top:10px;">最近更新：--</div>

      <div class="modal-actions">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button id="saveNoteBtn" class="primary">保存当天记录</button>
          <button id="clearDayBtn">清空这一天</button>
        </div>
        <button id="closeModalBtn">关闭</button>
      </div>
    </div>
  </div>

  <div class="modal" id="linkModal">
    <div class="modal-card">
      <div class="selected-date" id="linkModalTitle">设置关联任务</div>
      <div class="small">选择完成当前任务时要自动一起完成的任务，可多选。</div>
      <div class="option-grid" id="linkOptionGrid"></div>
      <div class="modal-actions">
        <button id="saveLinksBtn" class="primary">保存关联</button>
        <button id="closeLinkModalBtn">取消</button>
      </div>
    </div>
  </div>

  <div class="modal" id="historyModal">
    <div class="modal-card">
      <div class="selected-date">最近修改记录</div>
      <div class="small">保存最近 20 次日期修改。撤销会同步到所有设备。</div>
      <div class="history-list" id="historyList"></div>
      <div class="modal-actions">
        <button id="undoFromHistoryBtn" class="primary">撤销最近一次</button>
        <button id="closeHistoryModalBtn">关闭</button>
      </div>
    </div>
  </div>

  <div class="modal" id="averageModal">
    <div class="modal-card">
      <div class="selected-date">选择频率统计任务</div>
      <div class="small">可多选；统计会跟随当前查看的月份或年份自动变化。</div>
      <div class="option-grid" id="averageOptionGrid"></div>
      <div class="modal-actions">
        <button id="saveAverageTasksBtn" class="primary">保存选择</button>
        <button id="closeAverageModalBtn">取消</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteField, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBhwkDkx_xCU51bd7owNF74FunoUec2KrY",
      authDomain: "hfsex-a6114.firebaseapp.com",
      projectId: "hfsex-a6114",
      storageBucket: "hfsex-a6114.firebasestorage.app",
      messagingSenderId: "35309193656",
      appId: "1:35309193656:web:32871f89f8729de715e74d",
      measurementId: "G-5EK9Q00F21"
      
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const docRef = doc(db, "calendar", "shared");

    const DEFAULT_STATE = {
      legends: [
        { id: "red", color: "#f87171", label: "挑战 A" },
        { id: "orange", color: "#fb923c", label: "挑战 B" },
        { id: "yellow", color: "#facc15", label: "挑战 C" },
        { id: "green", color: "#4ade80", label: "挑战 D" },
        { id: "blue", color: "#60a5fa", label: "挑战 E" },
        { id: "purple", color: "#c084fc", label: "挑战 F" }
      ],
      entries: {},
      history: [],
      averageLegendIds: [],
      updatedAt: null
    };

    const MAX_HISTORY = 20;

    let state = structuredClone(DEFAULT_STATE);
    let currentDate = new Date();
    let currentView = "month";
    let selectedDateKey = null;
    let selectedLegendIds = [];
    let linkingLegendId = null;
    let pendingLinkedLegendIds = [];
    let searchQuery = "";
    let filterLegendId = "";
    let pendingAverageLegendIds = [];

    const mainTitle = document.getElementById("mainTitle");
    const monthAverageSummary = document.getElementById("monthAverageSummary");
    const calendarGrid = document.getElementById("calendarGrid");
    const yearGrid = document.getElementById("yearGrid");
    const legendList = document.getElementById("legendList");
    const rangeCount = document.getElementById("rangeCount");
    const totalCount = document.getElementById("totalCount");
    const totalLabel = document.getElementById("totalLabel");
    const rangeLabel = document.getElementById("rangeLabel");
    const yearSelect = document.getElementById("yearSelect");
    const monthSelect = document.getElementById("monthSelect");
    const monthView = document.getElementById("monthView");
    const yearView = document.getElementById("yearView");
    const modal = document.getElementById("modal");
    const selectedDateText = document.getElementById("selectedDateText");
    const optionGrid = document.getElementById("optionGrid");
    const noteInput = document.getElementById("noteInput");
    const saveStatus = document.getElementById("saveStatus");
    const lastUpdatedText = document.getElementById("lastUpdatedText");
    const linkModal = document.getElementById("linkModal");
    const linkModalTitle = document.getElementById("linkModalTitle");
    const linkOptionGrid = document.getElementById("linkOptionGrid");
    const searchInput = document.getElementById("searchInput");
    const filterLegendSelect = document.getElementById("filterLegendSelect");
    const importJsonInput = document.getElementById("importJsonInput");
    const historyModal = document.getElementById("historyModal");
    const historyList = document.getElementById("historyList");
    const averageList = document.getElementById("averageList");
    const averageRangeText = document.getElementById("averageRangeText");
    const frequencyPanelTitle = document.getElementById("frequencyPanelTitle");
    const averageModal = document.getElementById("averageModal");
    const averageOptionGrid = document.getElementById("averageOptionGrid");
    const mobileMenuQuery = window.matchMedia("(max-width: 760px)");

    function syncResponsiveMenus(event) {
      document.querySelectorAll(".actions-menu, .filter-menu").forEach((menu) => {
        menu.open = !event.matches;
      });
    }

    syncResponsiveMenus(mobileMenuQuery);
    mobileMenuQuery.addEventListener("change", syncResponsiveMenus);

    document.getElementById("chooseAverageTasksBtn").addEventListener("click", openAverageModal);
    document.getElementById("closeAverageModalBtn").addEventListener("click", closeAverageModal);
    averageModal.addEventListener("click", (e) => {
      if (e.target === averageModal) closeAverageModal();
    });
    document.getElementById("saveAverageTasksBtn").addEventListener("click", saveAverageTasks);

    document.getElementById("monthViewBtn").addEventListener("click", () => {
      currentView = "month";
      render();
    });

    document.getElementById("yearViewBtn").addEventListener("click", () => {
      currentView = "year";
      render();
    });

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentView === "month") {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
      } else {
        currentDate = new Date(currentDate.getFullYear() - 1, 0, 1);
      }
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentView === "month") {
        currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
      } else {
        currentDate = new Date(currentDate.getFullYear() + 1, 0, 1);
      }
      render();
    });

    document.getElementById("todayBtn").addEventListener("click", () => {
      currentDate = new Date();
      currentView = "month";
      render();
    });

    document.getElementById("thisYearBtn").addEventListener("click", () => {
      const now = new Date();
      currentDate = new Date(now.getFullYear(), 0, 1);
      currentView = "year";
      render();
    });

    document.getElementById("exportJsonBtn").addEventListener("click", () => {
      exportJson();
    });

    document.getElementById("exportCsvBtn").addEventListener("click", () => {
      exportCsv();
    });

    document.getElementById("importJsonBtn").addEventListener("click", () => importJsonInput.click());
    importJsonInput.addEventListener("change", importJsonBackup);

    document.getElementById("undoBtn").addEventListener("click", undoLastChange);
    document.getElementById("undoFromHistoryBtn").addEventListener("click", undoLastChange);
    document.getElementById("historyBtn").addEventListener("click", openHistoryModal);
    document.getElementById("closeHistoryModalBtn").addEventListener("click", closeHistoryModal);
    historyModal.addEventListener("click", (e) => {
      if (e.target === historyModal) closeHistoryModal();
    });

    searchInput.addEventListener("input", () => {
      searchQuery = searchInput.value.trim().toLowerCase();
      render();
    });
    filterLegendSelect.addEventListener("change", () => {
      filterLegendId = filterLegendSelect.value;
      render();
    });
    document.getElementById("clearFilterBtn").addEventListener("click", () => {
      searchQuery = "";
      filterLegendId = "";
      searchInput.value = "";
      render();
    });

    document.getElementById("addLegendBtn").addEventListener("click", async () => {
      await addLegend();
    });

    yearSelect.addEventListener("change", () => {
      currentDate = new Date(Number(yearSelect.value), currentDate.getMonth(), 1);
      render();
    });

    monthSelect.addEventListener("change", () => {
      currentDate = new Date(currentDate.getFullYear(), Number(monthSelect.value), 1);
      render();
    });

    document.getElementById("closeModalBtn").addEventListener("click", closeModal);

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    document.getElementById("closeLinkModalBtn").addEventListener("click", closeLinkModal);
    linkModal.addEventListener("click", (e) => {
      if (e.target === linkModal) closeLinkModal();
    });
    document.getElementById("saveLinksBtn").addEventListener("click", async () => {
      if (!linkingLegendId) return;
      const legend = getLegendById(linkingLegendId);
      if (!legend) return;
      legend.linkedLegendIds = [...pendingLinkedLegendIds];
      await saveState();
      closeLinkModal();
      render();
    });

    document.getElementById("saveNoteBtn").addEventListener("click", async () => {
      if (!selectedDateKey) return;
      const oldEntry = state.entries[selectedDateKey] || {};
      const previousEntry = state.entries[selectedDateKey] ? structuredClone(state.entries[selectedDateKey]) : null;
      const entry = {
        ...oldEntry,
        legendId: selectedLegendIds[0] || null,
        legendIds: [...selectedLegendIds],
        note: noteInput.value.trim()
      };
      state.entries[selectedDateKey] = entry;
      await saveDateEntry(selectedDateKey, entry, previousEntry);
      closeModal();
    });

    document.getElementById("clearDayBtn").addEventListener("click", async () => {
      if (!selectedDateKey) return;
      if (!confirm(`确定要清空 ${formatDateKey(selectedDateKey)} 的记录吗？`)) return;
      const dateKey = selectedDateKey;
      const previousEntry = state.entries[dateKey] ? structuredClone(state.entries[dateKey]) : null;
      delete state.entries[dateKey];
      await deleteDateEntry(dateKey, previousEntry);
      closeModal();
    });

    function getMonthPrefix(year, month) {
      return `${year}-${String(month + 1).padStart(2, "0")}-`;
    }

    function getDateKey(date) {
      return [
        date.getFullYear(),
        String(date.getMonth() + 1).padStart(2, "0"),
        String(date.getDate()).padStart(2, "0")
      ].join("-");
    }

    function formatDateKey(dateKey) {
      const [y, m, d] = dateKey.split("-");
      return `${y}年${Number(m)}月${Number(d)}日`;
    }

    function formatTimestamp(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "--";
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function getEntry(dateKey) {
      return state.entries[dateKey] || null;
    }

    function getEntryLegendIds(entry) {
      if (!entry || typeof entry !== "object") return [];
      if (Array.isArray(entry.legendIds)) {
        return [...new Set(entry.legendIds.filter((id) => typeof id === "string" && id))];
      }
      return entry.legendId ? [entry.legendId] : [];
    }

    function getLegendById(id) {
      return state.legends.find((l) => l.id === id) || null;
    }

    function hasActiveFilter() {
      return Boolean(searchQuery || filterLegendId);
    }

    function getFilteredLegends(entry) {
      if (!entry) return [];
      let legends = getEntryLegendIds(entry).map(getLegendById).filter(Boolean);
      if (filterLegendId) legends = legends.filter((legend) => legend.id === filterLegendId);
      if (!searchQuery) return legends;
      const noteMatches = String(entry.note || "").toLowerCase().includes(searchQuery);
      if (noteMatches) return legends;
      return legends.filter((legend) => legend.label.toLowerCase().includes(searchQuery));
    }

    function entryMatchesFilter(entry) {
      if (!hasActiveFilter()) return true;
      if (!entry) return false;
      const allLegends = getEntryLegendIds(entry).map(getLegendById).filter(Boolean);
      const eligibleLegends = filterLegendId
        ? allLegends.filter((legend) => legend.id === filterLegendId)
        : allLegends;
      if (filterLegendId && !eligibleLegends.length) return false;
      if (!searchQuery) return true;
      return String(entry.note || "").toLowerCase().includes(searchQuery)
        || eligibleLegends.some((legend) => legend.label.toLowerCase().includes(searchQuery));
    }

    function getLinkedLegendIds(legend) {
      if (!legend || !Array.isArray(legend.linkedLegendIds)) return [];
      return [...new Set(legend.linkedLegendIds.filter((id) => id !== legend.id && getLegendById(id)))];
    }

    function expandLinkedLegendIds(initialIds) {
      const result = [];
      const visited = new Set();
      const queue = [...initialIds];
      while (queue.length) {
        const id = queue.shift();
        if (!id || visited.has(id) || !getLegendById(id)) continue;
        visited.add(id);
        result.push(id);
        getLinkedLegendIds(getLegendById(id)).forEach((linkedId) => queue.push(linkedId));
      }
      return result;
    }

    function setSaveStatus(message, isError = false) {
      saveStatus.textContent = message;
      saveStatus.style.color = isError ? "#b91c1c" : "var(--muted)";
    }

    function makeLegendId() {
      return `legend_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function exportJson() {
      const payload = JSON.stringify(state, null, 2);
      const today = getDateKey(new Date());
      downloadFile(payload, `shared-calendar-${today}.json`, "application/json;charset=utf-8");
    }

    async function importJsonBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      try {
        const imported = JSON.parse(await file.text());
        if (!imported || !Array.isArray(imported.legends) || !imported.entries || typeof imported.entries !== "object" || Array.isArray(imported.entries)) {
          throw new Error("备份格式不正确");
        }
        const validLegends = imported.legends.every((legend) => legend && typeof legend.id === "string" && typeof legend.label === "string" && typeof legend.color === "string");
        if (!validLegends) throw new Error("任务类型数据不完整");
        if (!confirm(`将导入 ${Object.keys(imported.entries).length} 天记录和 ${imported.legends.length} 个任务类型。当前内容会被备份文件替换，确定继续吗？`)) return;

        const updatedAt = new Date().toISOString();
        const restoredState = {
          ...state,
          legends: structuredClone(imported.legends),
          entries: structuredClone(imported.entries),
          history: Array.isArray(state.history) ? state.history : [],
          updatedAt
        };
        await setDoc(docRef, restoredState, { merge: true });
        state = restoredState;
        setSaveStatus("备份已导入，其他设备会自动同步");
        render();
      } catch (err) {
        console.error("importJsonBackup failed:", err);
        alert(`导入失败：${err.message || "无法读取备份文件"}`);
      } finally {
        importJsonInput.value = "";
      }
    }

    function makeHistoryItem(action, dateKey, before, after) {
      return {
        id: `history_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
        action,
        dateKey,
        before: before ? structuredClone(before) : null,
        after: after ? structuredClone(after) : null,
        timestamp: new Date().toISOString()
      };
    }

    function appendHistory(item) {
      const history = Array.isArray(state.history) ? state.history : [];
      state.history = [...history, item].slice(-MAX_HISTORY);
      return state.history;
    }

    function describeHistoryItem(item) {
      const action = item.action === "delete" ? "清空" : "修改";
      return `${action}了 ${formatDateKey(item.dateKey)}`;
    }

    function openHistoryModal() {
      renderHistoryList();
      historyModal.classList.add("show");
    }

    function closeHistoryModal() {
      historyModal.classList.remove("show");
    }

    function renderHistoryList() {
      historyList.innerHTML = "";
      const history = Array.isArray(state.history) ? [...state.history].reverse() : [];
      if (!history.length) {
        historyList.innerHTML = '<div class="small">还没有可撤销的日期修改。</div>';
      } else {
        history.forEach((item) => {
          const row = document.createElement("div");
          row.className = "history-item";
          row.innerHTML = `<div style="font-weight:700;">${escapeHtml(describeHistoryItem(item))}</div><div class="small">${escapeHtml(formatTimestamp(item.timestamp))}</div>`;
          historyList.appendChild(row);
        });
      }
      const disabled = !history.length;
      document.getElementById("undoBtn").disabled = disabled;
      document.getElementById("undoFromHistoryBtn").disabled = disabled;
    }

    async function undoLastChange() {
      const history = Array.isArray(state.history) ? state.history : [];
      const item = history[history.length - 1];
      if (!item) {
        alert("还没有可以撤销的日期修改。");
        return;
      }
      if (!confirm(`确定撤销“${describeHistoryItem(item)}”吗？`)) return;
      try {
        setSaveStatus("正在撤销...");
        const updatedAt = new Date().toISOString();
        const nextHistory = history.slice(0, -1);
        const updates = { history: nextHistory, updatedAt };
        updates[`entries.${item.dateKey}`] = item.before === null ? deleteField() : item.before;
        await updateDoc(docRef, updates);
        if (item.before === null) delete state.entries[item.dateKey];
        else state.entries[item.dateKey] = structuredClone(item.before);
        state.history = nextHistory;
        state.updatedAt = updatedAt;
        closeHistoryModal();
        setSaveStatus("已撤销，其他设备会自动同步");
        render();
      } catch (err) {
        console.error("undoLastChange failed:", err);
        setSaveStatus("撤销失败，请检查网络。", true);
        alert("撤销失败，请检查网络。");
      }
    }

    function csvEscape(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    function exportCsv() {
      const rows = [["date", "legendId", "label", "color", "note", "updatedAt"]];
      const sortedKeys = Object.keys(state.entries).sort();

      sortedKeys.forEach((dateKey) => {
        const entry = state.entries[dateKey] || {};
        const legendIds = getEntryLegendIds(entry);
        if (!legendIds.length) legendIds.push("");
        legendIds.forEach((legendId) => {
          const legend = legendId ? getLegendById(legendId) : null;
          rows.push([
            dateKey,
            legendId,
            legend?.label || "",
            legend?.color || "",
            entry.note || "",
            state.updatedAt || ""
          ]);
        });
      });

      const csv = rows.map((row) => row.map(csvEscape).join(",")).join("\n");
      const today = getDateKey(new Date());
      downloadFile(csv, `shared-calendar-${today}.csv`, "text/csv;charset=utf-8");
    }

    async function addLegend() {
      const label = prompt("请输入新类型名称", `挑战 ${state.legends.length + 1}`);
      if (label === null) return;

      const cleanLabel = label.trim() || `挑战 ${state.legends.length + 1}`;
      state.legends.push({
        id: makeLegendId(),
        color: "#94a3b8",
        label: cleanLabel
      });
      await saveState();
      render();
    }

    function configureLinkedLegends(legendId) {
      const legend = getLegendById(legendId);
      if (!legend) return;
      const candidates = state.legends.filter((item) => item.id !== legendId);
      if (!candidates.length) {
        alert("请先新增至少一个其他任务类型。");
        return;
      }
      linkingLegendId = legendId;
      pendingLinkedLegendIds = getLinkedLegendIds(legend);
      linkModalTitle.textContent = `“${legend.label}”自动带上的任务`;
      renderLinkOptions();
      linkModal.classList.add("show");
    }

    function renderLinkOptions() {
      linkOptionGrid.innerHTML = "";
      state.legends.filter((legend) => legend.id !== linkingLegendId).forEach((legend) => {
        const isSelected = pendingLinkedLegendIds.includes(legend.id);
        const item = document.createElement("div");
        item.className = `option${isSelected ? " selected" : ""}`;
        item.innerHTML = `
          <div class="swatch" style="background:${legend.color}"></div>
          <div class="option-text"><div style="font-weight:700;">${escapeHtml(legend.label)}</div></div>
          <div class="option-check">${isSelected ? "已关联" : "选择"}</div>
        `;
        item.addEventListener("click", () => {
          const index = pendingLinkedLegendIds.indexOf(legend.id);
          if (index >= 0) pendingLinkedLegendIds.splice(index, 1);
          else pendingLinkedLegendIds.push(legend.id);
          renderLinkOptions();
        });
        linkOptionGrid.appendChild(item);
      });
    }

    function closeLinkModal() {
      linkModal.classList.remove("show");
      linkingLegendId = null;
      pendingLinkedLegendIds = [];
    }

    function getAverageLegendIds() {
      if (!Array.isArray(state.averageLegendIds)) return [];
      return [...new Set(state.averageLegendIds.filter((id) => getLegendById(id)))];
    }

    function openAverageModal() {
      pendingAverageLegendIds = getAverageLegendIds();
      renderAverageOptions();
      averageModal.classList.add("show");
    }

    function closeAverageModal() {
      averageModal.classList.remove("show");
      pendingAverageLegendIds = [];
    }

    function renderAverageOptions() {
      averageOptionGrid.innerHTML = "";
      state.legends.forEach((legend) => {
        const isSelected = pendingAverageLegendIds.includes(legend.id);
        const item = document.createElement("div");
        item.className = `option${isSelected ? " selected" : ""}`;
        item.innerHTML = `
          <div class="swatch" style="background:${legend.color}"></div>
          <div class="option-text"><div style="font-weight:700;">${escapeHtml(legend.label)}</div></div>
          <div class="option-check">${isSelected ? "已选择" : "选择"}</div>
        `;
        item.addEventListener("click", () => {
          const index = pendingAverageLegendIds.indexOf(legend.id);
          if (index >= 0) pendingAverageLegendIds.splice(index, 1);
          else pendingAverageLegendIds.push(legend.id);
          renderAverageOptions();
        });
        averageOptionGrid.appendChild(item);
      });
    }

    async function saveAverageTasks() {
      try {
        setSaveStatus("保存中...");
        const updatedAt = new Date().toISOString();
        state.averageLegendIds = [...pendingAverageLegendIds];
        state.updatedAt = updatedAt;
        await updateDoc(docRef, {
          averageLegendIds: state.averageLegendIds,
          updatedAt
        });
        closeAverageModal();
        setSaveStatus("频率统计任务已保存，其他设备会自动同步");
        render();
      } catch (err) {
        console.error("saveAverageTasks failed:", err);
        setSaveStatus("保存失败，请检查网络。", true);
        alert("保存失败，请检查网络。");
      }
    }

    async function deleteLegend(legendId) {
      const usingCount = Object.values(state.entries).filter((entry) => getEntryLegendIds(entry).includes(legendId)).length;
      const legend = getLegendById(legendId);
      if (!legend) return;

      const message = usingCount > 0
        ? `类型“${legend.label}”正在被 ${usingCount} 条记录使用。删除后，这些日期会保留备注，但类型会被清空。确定删除吗？`
        : `确定删除类型“${legend.label}”吗？`;

      if (!confirm(message)) return;

      state.legends = state.legends.filter((legendItem) => legendItem.id !== legendId);

      Object.values(state.entries).forEach((entry) => {
        if (!entry || typeof entry !== "object") return;
        const remainingIds = getEntryLegendIds(entry).filter((id) => id !== legendId);
        entry.legendIds = remainingIds;
        entry.legendId = remainingIds[0] || null;
      });

      state.legends.forEach((legendItem) => {
        if (Array.isArray(legendItem.linkedLegendIds)) {
          legendItem.linkedLegendIds = legendItem.linkedLegendIds.filter((id) => id !== legendId);
        }
      });
      if (Array.isArray(state.averageLegendIds)) {
        state.averageLegendIds = state.averageLegendIds.filter((id) => id !== legendId);
      }

      await saveState();
      render();
    }

    async function saveState() {
      try {
        setSaveStatus("保存中...");
        state.updatedAt = new Date().toISOString();
        await setDoc(docRef, state);
        setSaveStatus("已保存");
      } catch (err) {
        console.error("saveState failed:", err);
        setSaveStatus("保存失败，请检查 Firebase 配置和 Firestore Rules。", true);
        alert("保存失败，请检查 Firebase 配置和 Firestore Rules。");
      }
    }

    async function saveDateEntry(dateKey, entry, previousEntry) {
      try {
        setSaveStatus("保存中...");
        const updatedAt = new Date().toISOString();
        const history = appendHistory(makeHistoryItem("update", dateKey, previousEntry, entry));
        state.updatedAt = updatedAt;
        await updateDoc(docRef, {
          [`entries.${dateKey}`]: entry,
          history,
          updatedAt
        });
        setSaveStatus("已保存，其他设备会自动同步");
      } catch (err) {
        console.error("saveDateEntry failed:", err);
        setSaveStatus("保存失败，请检查网络或 Firebase 配置。", true);
        alert("保存失败，请检查网络或 Firebase 配置。");
      }
    }

    async function deleteDateEntry(dateKey, previousEntry) {
      try {
        setSaveStatus("保存中...");
        const updatedAt = new Date().toISOString();
        const history = appendHistory(makeHistoryItem("delete", dateKey, previousEntry, null));
        state.updatedAt = updatedAt;
        await updateDoc(docRef, {
          [`entries.${dateKey}`]: deleteField(),
          history,
          updatedAt
        });
        setSaveStatus("已清空，其他设备会自动同步");
      } catch (err) {
        console.error("deleteDateEntry failed:", err);
        setSaveStatus("清空失败，请检查网络或 Firebase 配置。", true);
        alert("清空失败，请检查网络或 Firebase 配置。");
      }
    }

    async function ensureDocExists() {
      try {
        const snap = await getDoc(docRef);
        if (!snap.exists()) {
          await setDoc(docRef, DEFAULT_STATE);
        }
      } catch (err) {
        console.error("Firestore init error:", err);
      }
    }

    function buildSelects() {
      const baseYear = new Date().getFullYear();
      yearSelect.innerHTML = "";
      for (let y = baseYear - 5; y <= baseYear + 5; y++) {
        const op = document.createElement("option");
        op.value = y;
        op.textContent = `${y}年`;
        if (y === currentDate.getFullYear()) op.selected = true;
        yearSelect.appendChild(op);
      }

      monthSelect.innerHTML = "";
      for (let m = 0; m < 12; m++) {
        const op = document.createElement("option");
        op.value = m;
        op.textContent = `${m + 1}月`;
        if (m === currentDate.getMonth()) op.selected = true;
        monthSelect.appendChild(op);
      }
    }

    function buildFilterSelect() {
      const currentValue = filterLegendId;
      filterLegendSelect.innerHTML = '<option value="">全部任务</option>';
      state.legends.forEach((legend) => {
        const option = document.createElement("option");
        option.value = legend.id;
        option.textContent = legend.label;
        filterLegendSelect.appendChild(option);
      });
      if (state.legends.some((legend) => legend.id === currentValue)) {
        filterLegendSelect.value = currentValue;
      } else {
        filterLegendId = "";
      }
      searchInput.value = searchQuery;
    }

    function openModal(dateKey) {
      selectedDateKey = dateKey;
      selectedDateText.textContent = formatDateKey(dateKey);

      const currentEntry = getEntry(dateKey);
      selectedLegendIds = getEntryLegendIds(currentEntry);
      noteInput.value = currentEntry?.note || "";
      lastUpdatedText.textContent = `最近更新：${formatTimestamp(state.updatedAt)}`;

      renderModalOptions();
      modal.classList.add("show");
    }

    function renderModalOptions() {
      optionGrid.innerHTML = "";

      state.legends.forEach((legend) => {
        const isSelected = selectedLegendIds.includes(legend.id);
        const linkedNames = getLinkedLegendIds(legend).map((id) => getLegendById(id)?.label).filter(Boolean);
        const item = document.createElement("div");
        item.className = `option${isSelected ? " selected" : ""}`;
        item.innerHTML = `
          <div class="swatch" style="background:${legend.color}"></div>
          <div class="option-text">
            <div style="font-weight:700;">${escapeHtml(legend.label)}</div>
            <div class="small">总共 ${getLegendTotalCount(legend.id)} 次${linkedNames.length ? ` · 自动带上 ${escapeHtml(linkedNames.join("、"))}` : ""}</div>
          </div>
          <div class="option-check">${isSelected ? "已选择" : "选择"}</div>
        `;

        item.addEventListener("click", () => {
          const selectedIndex = selectedLegendIds.indexOf(legend.id);
          if (selectedIndex >= 0) {
            selectedLegendIds.splice(selectedIndex, 1);
          } else {
            selectedLegendIds = [...new Set([
              ...selectedLegendIds,
              ...expandLinkedLegendIds([legend.id])
            ])];
          }
          renderModalOptions();
        });

        optionGrid.appendChild(item);
      });
    }

    function closeModal() {
      modal.classList.remove("show");
      selectedDateKey = null;
      selectedLegendIds = [];
    }

    function getLegendTotalCount(legendId) {
      return Object.values(state.entries).filter((entry) => getEntryLegendIds(entry).includes(legendId)).length;
    }

    function getLegendRangeCount(legendId) {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      if (currentView === "month") {
        const prefix = getMonthPrefix(year, month);
        return Object.entries(state.entries).filter(([key, entry]) => key.startsWith(prefix) && getEntryLegendIds(entry).includes(legendId)).length;
      }

      const yearPrefix = `${year}-`;
      return Object.entries(state.entries).filter(([key, entry]) => key.startsWith(yearPrefix) && getEntryLegendIds(entry).includes(legendId)).length;
    }

    function renderLegendEditor() {
      legendList.innerHTML = "";

      state.legends.forEach((legend) => {
        const row = document.createElement("div");
        row.className = "legend-item";

        const color = document.createElement("input");
        color.type = "color";
        color.className = "legend-color";
        color.value = legend.color;

        const main = document.createElement("div");
        main.className = "legend-main";

        const input = document.createElement("input");
        input.className = "legend-input";
        input.value = legend.label;

        const count = document.createElement("div");
        count.className = "legend-count";
        const linkedNames = getLinkedLegendIds(legend).map((id) => getLegendById(id)?.label).filter(Boolean);
        count.textContent = `当前 ${getLegendRangeCount(legend.id)} 次 / 总共 ${getLegendTotalCount(legend.id)} 次${linkedNames.length ? ` · 自动带上：${linkedNames.join("、")}` : ""}`;

        const actions = document.createElement("div");
        actions.className = "legend-actions";

        const linkBtn = document.createElement("button");
        linkBtn.type = "button";
        linkBtn.className = "link-btn";
        linkBtn.textContent = "关联";

        const deleteBtn = document.createElement("button");
        deleteBtn.type = "button";
        deleteBtn.className = "icon-btn";
        deleteBtn.textContent = "删除";

        color.addEventListener("input", async () => {
          legend.color = color.value;
          await saveState();
        });

        input.addEventListener("change", async () => {
          legend.label = input.value.trim() || "未命名";
          await saveState();
        });

        deleteBtn.addEventListener("click", async () => {
          await deleteLegend(legend.id);
        });

        linkBtn.addEventListener("click", async () => {
          await configureLinkedLegends(legend.id);
        });

        main.appendChild(input);
        main.appendChild(count);

        row.appendChild(color);
        row.appendChild(main);
        actions.appendChild(linkBtn);
        actions.appendChild(deleteBtn);
        row.appendChild(actions);
        legendList.appendChild(row);
      });
    }

    function renderMonthView() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      mainTitle.textContent = `${year}年 ${month + 1}月`;
      calendarGrid.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrevMonth = new Date(year, month, 0).getDate();
      const todayKey = getDateKey(new Date());

      for (let i = 0; i < 42; i++) {
        let dayNum;
        let cellDate;
        let otherMonth = false;

        if (i < startWeekday) {
          dayNum = daysInPrevMonth - startWeekday + i + 1;
          cellDate = new Date(year, month - 1, dayNum);
          otherMonth = true;
        } else if (i >= startWeekday + daysInMonth) {
          dayNum = i - (startWeekday + daysInMonth) + 1;
          cellDate = new Date(year, month + 1, dayNum);
          otherMonth = true;
        } else {
          dayNum = i - startWeekday + 1;
          cellDate = new Date(year, month, dayNum);
        }

        const dateKey = getDateKey(cellDate);
        const entry = getEntry(dateKey);
        const legends = hasActiveFilter()
          ? getFilteredLegends(entry)
          : getEntryLegendIds(entry).map(getLegendById).filter(Boolean);

        const day = document.createElement("div");
        day.className = "day";
        if (otherMonth) day.classList.add("other-month");
        if (dateKey === todayKey) day.classList.add("today");
        if (entry && hasActiveFilter() && !entryMatchesFilter(entry)) day.classList.add("filtered-out");
        day.innerHTML = `<div class="date-number">${dayNum}</div>`;

        if (legends.length) {
          const list = document.createElement("div");
          list.className = "entry-list";
          legends.slice(0, 3).forEach((legend) => {
            const label = document.createElement("div");
            label.className = "entry-label";
            label.style.background = legend.color;
            label.textContent = legend.label;
            list.appendChild(label);
          });
          if (legends.length > 3) {
            const more = document.createElement("div");
            more.className = "entry-more";
            more.textContent = `还有 ${legends.length - 3} 项`;
            list.appendChild(more);
          }
          day.appendChild(list);
        }

        if (entry?.note) {
          const note = document.createElement("div");
          note.className = "entry-note";
          note.textContent = entry.note;
          day.appendChild(note);
        }

        day.addEventListener("click", () => openModal(dateKey));
        calendarGrid.appendChild(day);
      }
    }

    function buildEqualBorderGradient(legends) {
      if (!legends.length) return "";
      if (legends.length === 1) return legends[0].color;
      const stops = legends.flatMap((legend, index) => {
        const start = (index / legends.length) * 100;
        const end = ((index + 1) / legends.length) * 100;
        return [`${legend.color} ${start}%`, `${legend.color} ${end}%`];
      });
      return `conic-gradient(from -45deg, ${stops.join(", ")})`;
    }

    function renderMiniMonth(year, month) {
      const box = document.createElement("div");
      box.className = "mini-month";

      const title = document.createElement("div");
      title.className = "mini-month-title";
      title.textContent = `${month + 1}月`;
      box.appendChild(title);

      const weekdays = document.createElement("div");
      weekdays.className = "mini-weekdays";
      ["日", "一", "二", "三", "四", "五", "六"].forEach((d) => {
        const el = document.createElement("div");
        el.textContent = d;
        weekdays.appendChild(el);
      });
      box.appendChild(weekdays);

      const days = document.createElement("div");
      days.className = "mini-days";

      const firstDay = new Date(year, month, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement("div");
        empty.className = "mini-day empty";
        days.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        const dateKey = getDateKey(date);
        const entry = getEntry(dateKey);
        const legends = hasActiveFilter()
          ? getFilteredLegends(entry)
          : getEntryLegendIds(entry).map(getLegendById).filter(Boolean);

        const cell = document.createElement("div");
        cell.className = "mini-day";
        if (entry && hasActiveFilter() && !entryMatchesFilter(entry)) cell.classList.add("filtered-out");
        if (legends.length) {
          cell.classList.add("has-entry");
          cell.style.setProperty("--event-border", buildEqualBorderGradient(legends));
        }

        const number = document.createElement("div");
        number.className = "mini-day-number";
        number.textContent = d;
        cell.appendChild(number);

        if (legends.length) {
          const dots = document.createElement("div");
          dots.className = "mini-dots";
          legends.forEach((legend) => {
            const dot = document.createElement("span");
            dot.className = "mini-dot";
            dot.style.background = legend.color;
            dots.appendChild(dot);
          });
          cell.appendChild(dots);
        }

        cell.addEventListener("click", (e) => {
          e.stopPropagation();
          openModal(dateKey);
        });

        days.appendChild(cell);
      }

      box.appendChild(days);

      box.addEventListener("click", () => {
        currentDate = new Date(year, month, 1);
        currentView = "month";
        render();
      });

      return box;
    }

    function renderYearView() {
      const year = currentDate.getFullYear();
      mainTitle.textContent = `${year}年 全年总览`;
      yearGrid.innerHTML = "";
      for (let m = 0; m < 12; m++) {
        yearGrid.appendChild(renderMiniMonth(year, m));
      }
    }

    function renderStats() {
      const visibleKeys = Object.keys(state.entries).filter((key) => entryMatchesFilter(state.entries[key]));
      const total = visibleKeys.length;
      totalCount.textContent = total;
      totalLabel.textContent = hasActiveFilter() ? "全部筛选结果" : "总记录天数";
      lastUpdatedText.textContent = `最近更新：${formatTimestamp(state.updatedAt)}`;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      if (currentView === "month") {
        const prefix = getMonthPrefix(year, month);
        const count = visibleKeys.filter((k) => k.startsWith(prefix)).length;
        rangeCount.textContent = count;
        rangeLabel.textContent = hasActiveFilter() ? "本月筛选结果" : "本月已记录";
      } else {
        const yearPrefix = `${year}-`;
        const count = visibleKeys.filter((k) => k.startsWith(yearPrefix)).length;
        rangeCount.textContent = count;
        rangeLabel.textContent = hasActiveFilter() ? "本年筛选结果" : "本年已记录";
      }
    }

    function renderAverageStats() {
      const now = new Date();
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const isYearRange = currentView === "year";
      let isFutureRange;
      let elapsedDays;
      let prefix;
      let rangeEndKey;
      let rangeDescription;
      let periodLabel;

      if (isYearRange) {
        isFutureRange = year > now.getFullYear();
        const isCurrentYear = year === now.getFullYear();
        const daysInYear = new Date(year, 1, 29).getMonth() === 1 ? 366 : 365;
        const currentDayOfYear = Math.floor(
          (Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - Date.UTC(now.getFullYear(), 0, 1)) / 86400000
        ) + 1;
        elapsedDays = isFutureRange ? 0 : (isCurrentYear ? currentDayOfYear : daysInYear);
        prefix = `${year}-`;
        rangeEndKey = isFutureRange ? "" : (isCurrentYear ? getDateKey(now) : `${year}-12-31`);
        rangeDescription = isFutureRange
          ? `${year}年尚未开始`
          : `1月1日—${isCurrentYear ? `${now.getMonth() + 1}月${now.getDate()}日` : "12月31日"}，共 ${elapsedDays} 天`;
        periodLabel = `${year}年`;
        frequencyPanelTitle.textContent = "年度完成频率";
      } else {
        const viewedMonthStart = new Date(year, month, 1);
        const currentMonthStart = new Date(now.getFullYear(), now.getMonth(), 1);
        isFutureRange = viewedMonthStart > currentMonthStart;
        const isCurrentMonth = year === now.getFullYear() && month === now.getMonth();
        elapsedDays = isFutureRange
          ? 0
          : (isCurrentMonth ? now.getDate() : new Date(year, month + 1, 0).getDate());
        prefix = getMonthPrefix(year, month);
        rangeEndKey = elapsedDays > 0 ? getDateKey(new Date(year, month, elapsedDays)) : "";
        rangeDescription = isFutureRange
          ? `${year}年${month + 1}月尚未开始`
          : `${month + 1}月1日—${month + 1}月${elapsedDays}日，共 ${elapsedDays} 天`;
        periodLabel = `${month + 1}月`;
        frequencyPanelTitle.textContent = "月度完成频率";
      }
      const selectedIds = getAverageLegendIds();

      averageRangeText.textContent = rangeDescription;
      averageList.innerHTML = "";
      monthAverageSummary.textContent = "";

      if (!selectedIds.length) {
        averageList.innerHTML = '<div class="small" style="margin-top:7px;">点击“选择任务”添加要观察的任务。</div>';
        return;
      }

      const inlineParts = [];
      selectedIds.forEach((legendId) => {
        const legend = getLegendById(legendId);
        if (!legend) return;
        const count = Object.entries(state.entries).filter(([dateKey, entry]) => {
          return dateKey.startsWith(prefix)
            && elapsedDays > 0
            && dateKey <= rangeEndKey
            && getEntryLegendIds(entry).includes(legendId);
        }).length;
        const daysPerCompletion = count > 0 && elapsedDays > 0 ? elapsedDays / count : null;
        const frequencyText = isFutureRange
          ? "尚未开始"
          : (daysPerCompletion === null ? "尚未完成" : `${daysPerCompletion.toFixed(2)}天/次`);
        inlineParts.push(`${legend.label} ${frequencyText}`);
        const item = document.createElement("div");
        item.className = "average-item";
        item.innerHTML = `
          <div class="average-color" style="background:${legend.color}"></div>
          <div>
            <div style="font-size:12px;font-weight:700;">${escapeHtml(legend.label)}</div>
            <div class="small">${periodLabel}完成 ${count} 次</div>
          </div>
          <div class="average-value">${isFutureRange ? "尚未开始" : (daysPerCompletion === null ? "尚未完成" : `${daysPerCompletion.toFixed(2)} 天/次`)}</div>
        `;
        averageList.appendChild(item);
      });

      if (inlineParts.length) {
        monthAverageSummary.textContent = `（${inlineParts.join(" · ")}）`;
      }
    }

    function renderViewToggle() {
      const monthBtn = document.getElementById("monthViewBtn");
      const yearBtn = document.getElementById("yearViewBtn");

      monthBtn.classList.toggle("primary", currentView === "month");
      yearBtn.classList.toggle("primary", currentView === "year");

      monthView.style.display = currentView === "month" ? "block" : "none";
      yearView.style.display = currentView === "year" ? "block" : "none";
      monthSelect.style.visibility = currentView === "month" ? "visible" : "hidden";
      monthSelect.style.pointerEvents = currentView === "month" ? "auto" : "none";
    }

    function render() {
      if (!state || typeof state !== "object") {
        state = structuredClone(DEFAULT_STATE);
      }
      if (!state.legends) state.legends = structuredClone(DEFAULT_STATE.legends);
      if (!state.entries) state.entries = {};
      if (!Array.isArray(state.history)) state.history = [];
      if (!Array.isArray(state.averageLegendIds)) state.averageLegendIds = [];
      if (!state.updatedAt) state.updatedAt = null;

      buildSelects();
      buildFilterSelect();
      renderViewToggle();
      renderLegendEditor();
      renderHistoryList();

      if (currentView === "month") {
        renderMonthView();
      } else {
        renderYearView();
      }

      renderStats();
      renderAverageStats();
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    render();

    ensureDocExists().catch((err) => {
      console.error("ensureDocExists failed:", err);
    });

    onSnapshot(
      docRef,
      (snap) => {
        if (snap.exists()) {
          state = snap.data();
          if (!state.legends) state.legends = structuredClone(DEFAULT_STATE.legends);
          if (!state.entries) state.entries = {};
          if (!Array.isArray(state.history)) state.history = [];
          if (!Array.isArray(state.averageLegendIds)) state.averageLegendIds = [];
          if (!state.updatedAt) state.updatedAt = null;
          setSaveStatus("数据已同步");
          render();
        }
      },
      (err) => {
        console.error("onSnapshot failed:", err);
        setSaveStatus("同步失败，请检查网络或 Firebase 配置。", true);
      }
    );
  </script>
</body>
</html>
